<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>资产 · New money</title><link rel="stylesheet" href="app.css"><script src="shared.js" defer></script><script src="assets.js" defer></script></head><body><main class="frame"><header class="app-header"><a class="brand" href="index.html">New money</a><nav class="main-nav" aria-label="主要导航"><a href="index.html" data-route="assets" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v13H3zM3 7l14-4v4M16 12h5v4h-5z"/></svg>资产</a><a href="watch.html" data-route="market"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18V6m0 12h18M6 14l4-5 4 3 6-7"/></svg>大盘</a></nav><span class="demo-label">静态示例 · 仅存本机</span></header>
<section class="asset-overview" aria-labelledby="total-label"><h1 class="total-label" id="total-label">总资产</h1><div class="total-line"><strong class="total-value" id="total-value">1,000,000.00</strong><span class="total-unit" id="total-unit">元</span></div><p class="total-change">较上次变动 <span class="number">—</span>　暂无可比行情</p></section>
<div class="asset-layout"><section class="allocation-panel" aria-labelledby="allocation-title"><div class="section-heading"><h2 id="allocation-title">配置结构</h2><span>按资产类别</span></div><div id="allocation"></div><p class="allocation-empty" id="allocation-empty" hidden>记录资产后，这里显示各类金额与占比。</p></section>
<section aria-labelledby="details-title"><div class="section-heading"><h2 id="details-title">资产明细</h2><button type="button" class="primary" id="add-asset">＋ 添加资产</button></div><div id="asset-groups"></div><div class="empty-state" id="asset-empty" hidden><h2>还没有资产记录</h2><p>记下你现在有什么，从一笔现金或存款开始。</p><button type="button" id="empty-add-asset">添加第一条资产</button></div></section></div>
<p class="status-line asset-feedback" id="asset-status" role="status" aria-live="polite"></p>
<footer class="footer"><span>仅记录与展示，不构成投资建议</span><span>金额以手动记录为准</span></footer></main>
<dialog class="asset-dialog" id="asset-dialog" aria-labelledby="dialog-title"><form id="asset-form" novalidate>
<div class="dialog-heading"><h2 id="dialog-title">添加资产</h2><span>金额单位：元</span></div>
<div class="fields">
<div class="field full"><label for="asset-name">名称</label><input id="asset-name" type="text" autocomplete="off" maxlength="60" placeholder="例如：日常备用金" aria-describedby="form-error" autofocus></div>
<div class="field"><label for="asset-category">类别</label><select id="asset-category"><option>现金</option><option>存款</option><option>货币基金</option><option>股票</option><option>基金</option><option>债券</option><option>其他</option></select></div>
<div class="field"><label for="asset-amount">金额</label><input id="asset-amount" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-describedby="form-error"></div>
<details class="optional-details" id="asset-optional" hidden><summary>补充数量与现价（选填）</summary><div class="fields"><div class="field"><label for="asset-quantity">数量（股 / 份）</label><input id="asset-quantity" type="text" inputmode="decimal" placeholder="例如：1000" aria-describedby="form-error"></div><div class="field"><label for="asset-price">现价（元）</label><input id="asset-price" type="text" inputmode="decimal" placeholder="例如：65.00" aria-describedby="form-error"></div></div><p class="field-help">资产金额以填写的金额为准，数量与现价用于补充记录。</p></details>
</div><p class="form-error" id="form-error" role="status"></p>
<div class="dialog-actions"><button type="button" class="danger" id="delete-asset" hidden>删除资产</button><button type="button" id="cancel-asset">取消</button><button class="primary" type="submit">保存资产</button></div></form></dialog></body></html>
