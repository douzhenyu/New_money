<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>大盘 · New money</title><link rel="stylesheet" href="app.css"><script src="shared.js" defer></script><script src="market.js" defer></script></head><body><main class="frame"><header class="app-header"><a class="brand" href="index.html">New money</a><nav class="main-nav" aria-label="主要导航"><a href="index.html" data-route="assets"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v13H3zM3 7l14-4v4M16 12h5v4h-5z"/></svg>资产</a><a href="watch.html" data-route="market" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18V6m0 12h18M6 14l4-5 4 3 6-7"/></svg>大盘</a></nav><span class="demo-label">静态示例 · 仅存本机</span></header>
<div class="market-heading"><h1>大盘</h1><span>示例行情 · 非实时</span></div>
<div class="market-controls"><div class="segment" role="group" aria-label="大盘视图"><button type="button" id="view-index" aria-pressed="true">指数</button><button type="button" id="view-holdings" aria-pressed="false">持仓</button></div><label class="palette-label" for="quote-palette">涨跌配色<select id="quote-palette"><option value="cn">红涨绿跌 · A 股习惯</option><option value="us">绿涨红跌 · 美股习惯</option></select></label></div>
<section id="index-region" aria-label="指数概览"><div class="index-strip" id="index-strip" tabindex="0" aria-label="指数卡片，可横向滚动"></div></section>
<section aria-labelledby="quotes-title"><div class="quotes-heading"><h2 id="quotes-title">自选列表</h2><button type="button" class="quiet" id="add-watch">＋ 添加自选</button></div><div class="quote-list" id="quotes"></div><div class="empty-state" id="watch-empty" hidden><h2>还没有关注任何标的</h2><p>从下面的示例标的开始，建立你的自选列表。</p><button type="button" class="primary" id="empty-add-watch">添加自选</button><p class="field-help" style="margin-top:20px;margin-bottom:0">示例热门标的 · 全部为虚构数据</p><div class="suggestion-list" id="suggestions"></div></div></section>
<p class="color-note" id="color-note">当前红涨绿跌；不同市场习惯可能相反，请核对 + / −。</p>
<p class="status-line" id="market-status" role="status" aria-live="polite"></p>
<footer class="footer"><span>仅记录与展示，不构成投资建议</span><span>指数点位与价格均为静态示例</span></footer></main>
<dialog class="asset-dialog" id="watch-dialog" aria-labelledby="watch-dialog-title"><div class="dialog-heading"><h2 id="watch-dialog-title">添加自选</h2><span>虚构示例标的</span></div><p class="field-help">选择后加入当前自选列表。</p><div id="watch-options" class="suggestion-list"></div><div class="dialog-actions"><button type="button" id="cancel-watch">关闭</button></div></dialog></body></html>
